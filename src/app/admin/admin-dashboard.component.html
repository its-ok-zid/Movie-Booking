<div class="admin-dashboard-container">
<div class="navbar px-4 py-2" *ngIf="authService.isAuthenticated()">
  <div class="navbar-content">
    <button
      class="btn logout-button"
      (click)="logout()"
    >Logout</button>
  </div>
</div>
  <!-- Error Modal -->
  <div class="modal fade show" tabindex="-1" role="dialog"
       [ngStyle]="{display: showErrorModal ? 'block' : 'none', background: 'rgba(0,0,0,0.5)'}"
       *ngIf="showErrorModal">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Error</h5>
          <button type="button" class="close" (click)="closeErrorModal()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p>{{ errorModalMsg }}</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeErrorModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <h2 class="dashboard-heading">Admin Dashboard</h2>

  <div *ngIf="loading" class="loader-container">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="errorMsg" class="alert alert-danger text-center">{{ errorMsg }}</div>

  <div *ngIf="!loading" class="dashboard-card-grid">
    <div *ngFor="let movie of movies; let i = index" class="movie-card">
      <h4>{{ movie.movieName }}</h4>
      <p class="subtle">🎭 {{ movie.theatreName }}</p>

      <!-- Commented Out Booked Tickets -->
      <!-- <p><strong>Booked:</strong> {{ movie.bookedTickets }}</p> -->

      <p>
        <strong>Available:</strong>
        <span *ngIf="editIndex !== i">{{ movie.totalTickets }}</span>
        <input *ngIf="editIndex === i" type="number" [(ngModel)]="updatedTickets" min="0" class="form-control input-sm" />
      </p>

      <p><strong>Status:</strong> {{ movie.status }}</p>

      <div class="actions">
        <button *ngIf="editIndex !== i" class="btn btn-sm btn-primary" (click)="startEdit(i)">Edit</button>
        <button *ngIf="editIndex === i" class="btn btn-sm btn-success" (click)="saveTickets(i)">Save</button>
        <button *ngIf="editIndex === i" class="btn btn-sm btn-secondary" (click)="cancelEdit()">Cancel</button>
        <button class="btn btn-sm btn-danger" (click)="deleteMovie(i)">Delete</button>
      </div>
    </div>
  </div>
</div>
