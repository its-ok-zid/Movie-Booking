
<div class="movies-page-main">
  <div class="container py-4">
    <h2 class="text-center mb-4 trending-title">Trending Movies</h2>
    <div class="row justify-content-center mb-4">
      <div class="col-md-6 col-sm-10">
        <div class="input-group">
          <input type="text" class="form-control search-bar" placeholder="Search movie by name..." [(ngModel)]="searchTerm" (ngModelChange)="onSearchTermChange()">
        </div>
      </div>
    </div>
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <div *ngIf="errorMsg" class="alert alert-danger text-center">{{ errorMsg }}</div>
    <div class="row justify-content-center">
      <div *ngFor="let movie of filteredMovies" class="col-xl-3 col-lg-4 col-md-6 col-sm-12 mb-4">
        <div class="movie-card shadow-lg rounded h-100 d-flex flex-column">
          <div class="movie-img-wrapper position-relative">
            <img [src]="movie.imageUrl" class="movie-img w-100" alt="Movie Poster" />
            <span class="movie-status badge position-absolute top-0 end-0 m-2 px-3 py-2" [ngClass]="{
              'bg-success': movie.status === 'AVAILABLE',
              'bg-warning': movie.status === 'BOOKED',
              'bg-danger': movie.status === 'SOLD_OUT'
            }">{{ movie.status }}</span>
          </div>
          <div class="card-body d-flex flex-column flex-grow-1">
            <h5 class="card-title mb-2 text-truncate">{{ movie.movieName }}</h5>
            <p class="card-text mb-1 text-muted"><i class="bi bi-geo-alt-fill"></i> {{ movie.theatreName }}</p>
            <p class="card-text mb-1"><i class="bi bi-ticket-perforated"></i> <strong>Tickets:</strong> {{ movie.totalTickets }}</p>
            <div class="mt-auto pt-2 text-center">
              <button class="btn btn-primary w-100 book-btn" [disabled]="movie.totalTickets === 0 || movie.status === 'SOLD_OUT'" (click)="goToBookingPage(movie)">Book Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Booking modal removed; booking now handled on separate page -->
  </div>
</div>
