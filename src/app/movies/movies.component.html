<div class="movies-page-main">
  <div class="navbar d-flex justify-content-end align-items-center px-4 py-2" *ngIf="authService.isAuthenticated()">
          <button
            class="btn logout-button"
            (click)="logout()"
          >Logout</button>
  </div>
  <div class="container py-5">
    <h2 class="text-center trending-title mb-5">Now Showing</h2>

    <!-- Search Bar -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-6 col-sm-10">
        <input
          type="text"
          class="form-control search-bar shadow-sm"
          placeholder="Search for a movie..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchTermChange()"
        />
      </div>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMsg" class="alert alert-danger text-center">{{ errorMsg }}</div>

    <!-- Movies Grid -->
    <div class="row">
      <div
        *ngFor="let movie of filteredMovies"
        class="col-xl-3 col-lg-4 col-md-6 col-sm-12 mb-4"
      >
        <div class="movie-card h-100 d-flex flex-column shadow-sm">
          <div class="movie-img-wrapper">
            <img [src]="movie.imageUrl" alt="Poster" class="movie-img" />
            <span
              class="movie-status"
              [ngClass]="{
                'bg-success': movie.status === 'AVAILABLE',
                'bg-warning': movie.status === 'BOOKED',
                'bg-danger': movie.status === 'SOLD_OUT'
              }"
              >{{ movie.status }}</span
            >
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="movie-title text-truncate">{{ movie.movieName }}</h5>
            <p class="text-muted small"><i class="bi bi-geo-alt-fill"></i> {{ movie.theatreName }}</p>
            <p class="small"><i class="bi bi-ticket-perforated"></i> <strong>Tickets:</strong> {{ movie.totalTickets }}</p>

            <div class="mt-auto">
              <button
                class="btn btn-primary w-100 book-btn"
                [disabled]="movie.totalTickets === 0 || movie.status === 'SOLD_OUT'"
                (click)="goToBookingPage(movie)"
              >
                Book Now
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
