<div class="book-ticket-page-container">
  <h2 class="text-center mb-4">Book Tickets</h2>
  <app-book-ticket-modal
    [movieName]="movieName"
    [theatreName]="theatreName"
    [totalTickets]="totalTickets"
    (closed)="closeBooking()"
    (booked)="onBookingSuccess()">
  </app-book-ticket-modal>
</div>
