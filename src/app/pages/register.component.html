<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="register()">
    <div>
      <label for="username">Username</label>
      <input id="username" [(ngModel)]="username" name="username" required />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required />
    </div>
    <div>
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a (click)="goToLogin()">Login here</a></p>
</div>
