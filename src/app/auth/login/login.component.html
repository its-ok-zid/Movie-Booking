<div class="auth-container">
  <div class="form-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-box">
      <h1 class="mb-3">Sign In</h1>
      <p class="subtitle">or use your account</p>

      <input id="loginId" formControlName="loginId" class="input-field" type="text" placeholder="Login ID" />
      <div *ngIf="loginForm.get('loginId')?.invalid && (loginForm.get('loginId')?.dirty || loginForm.get('loginId')?.touched)" class="error-msg">
        Login ID is required
      </div>

      <input id="password" formControlName="password" class="input-field" type="password" placeholder="Password" />
      <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="error-msg">
        Password is required
      </div>

      <div class="form-check my-2">
        <input type="checkbox" class="form-check-input" id="remember-me" />
        <label class="form-check-label text-light" for="remember-me">Remember me</label>
      </div>

      <div *ngIf="errorMsg" class="error-msg text-center">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="success-msg text-center">{{ successMsg }}</div>

      <button type="submit" class="main-btn" [disabled]="loginForm.invalid">Log In</button>

      <a (click)="goToForgotPassword()" class="link-btn mt-2">Forgot your password?</a>
      <span class="text-light mt-2">Don't have an account?
        <a (click)="goToRegister()" class="link-btn">Sign up here</a>
      </span>
    </form>
  </div>
</div>
