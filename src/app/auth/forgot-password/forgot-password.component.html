<div class="login_page_main">
  <div class="container">
    <section class="d-flex flex-column justify-content-center align-items-center heading_landing_page_height">
      <div class="card shadow-lg rounded login_font_family">
        <div class="card-body">
          <h2 class="card-title text-center my-3">Reset Password</h2>
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="form-group mb-4">
              <label for="loginId" class="col-form-label text-white">Login ID</label>
              <input id="loginId" formControlName="loginId" class="form-control" type="text" placeholder="Enter login ID" />
              <div *ngIf="resetForm.get('loginId')?.invalid && (resetForm.get('loginId')?.dirty || resetForm.get('loginId')?.touched)" class="text-danger">
                Login ID is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="newPassword" class="col-form-label text-white">New Password</label>
              <input id="newPassword" formControlName="newPassword" class="form-control" type="password" placeholder="Enter new password" />
              <div *ngIf="resetForm.get('newPassword')?.invalid && (resetForm.get('newPassword')?.dirty || resetForm.get('newPassword')?.touched)" class="text-danger">
                New password is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="confirmPassword" class="col-form-label text-white">Confirm Password</label>
              <input id="confirmPassword" formControlName="confirmPassword" class="form-control" type="password" placeholder="Confirm new password" />
              <div *ngIf="resetForm.get('confirmPassword')?.invalid && (resetForm.get('confirmPassword')?.dirty || resetForm.get('confirmPassword')?.touched)" class="text-danger">
                Confirm password is required
              </div>
            </div>
            <div *ngIf="errorMsg" class="text-danger">{{ errorMsg }}</div>
            <div *ngIf="successMsg" class="text-success">{{ successMsg }}</div>
            <button type="submit" class="btn button_cs button_login my-3" [disabled]="resetForm.invalid">Reset Password</button>
            <div class="text-center mt-2 text-white">
              Remembered your password? <a routerLink="/login" class="btn btn-link p-0">Login here</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</div>
