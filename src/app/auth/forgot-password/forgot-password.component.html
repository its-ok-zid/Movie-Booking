<div class="container forgot-password-container">
  <div class="form-container single-form-container">
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <h1 class="mb-3">Reset Password</h1>
      <span>Enter your login ID and new password</span>

      <input id="loginId" formControlName="loginId" type="text" placeholder="Login ID" />
      <div *ngIf="resetForm.get('loginId')?.invalid && (resetForm.get('loginId')?.touched || resetForm.get('loginId')?.dirty)" class="text-danger">
        Login ID is required
      </div>

      <input id="newPassword" formControlName="newPassword" type="password" placeholder="New Password" />
      <div *ngIf="resetForm.get('newPassword')?.invalid && (resetForm.get('newPassword')?.touched || resetForm.get('newPassword')?.dirty)" class="text-danger">
        New password is required
      </div>

      <input id="confirmPassword" formControlName="confirmPassword" type="password" placeholder="Confirm Password" />
      <div *ngIf="resetForm.get('confirmPassword')?.invalid && (resetForm.get('confirmPassword')?.touched || resetForm.get('confirmPassword')?.dirty)" class="text-danger">
        Confirm password is required
      </div>

      <div *ngIf="errorMsg" class="text-danger mt-2">{{ errorMsg }}</div>
      <div *ngIf="successMsg" class="text-success mt-2">{{ successMsg }}</div>

      <button type="submit" [disabled]="resetForm.invalid">Reset</button>

      <a routerLink="/login">Back to Login</a>
    </form>
  </div>
</div>
