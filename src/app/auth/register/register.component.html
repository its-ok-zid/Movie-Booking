
<div class="login_page_main">
  <div class="container">
    <section class="d-flex flex-column justify-content-center align-items-center heading_landing_page_height">
      <div class="card shadow-lg rounded login_font_family">
        <div class="card-body">
          <h2 class="card-title text-center my-3">Register</h2>
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group mb-4">
              <label for="firstName" class="col-form-label text-white">First Name</label>
              <input id="firstName" formControlName="firstName" class="form-control" type="text" placeholder="Enter first name" />
              <div *ngIf="registerForm.get('firstName')?.invalid && (registerForm.get('firstName')?.dirty || registerForm.get('firstName')?.touched)" class="text-danger">
                First name is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="lastName" class="col-form-label text-white">Last Name</label>
              <input id="lastName" formControlName="lastName" class="form-control" type="text" placeholder="Enter last name" />
              <div *ngIf="registerForm.get('lastName')?.invalid && (registerForm.get('lastName')?.dirty || registerForm.get('lastName')?.touched)" class="text-danger">
                Last name is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="email" class="col-form-label text-white">Email</label>
              <input id="email" formControlName="email" class="form-control" type="email" placeholder="Enter email" />
              <div *ngIf="registerForm.get('email')?.invalid && (registerForm.get('email')?.dirty || registerForm.get('email')?.touched)" class="text-danger">
                Valid email is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="loginId" class="col-form-label text-white">Login ID</label>
              <input id="loginId" formControlName="loginId" class="form-control" type="text" placeholder="Enter login ID" />
              <div *ngIf="registerForm.get('loginId')?.invalid && (registerForm.get('loginId')?.dirty || registerForm.get('loginId')?.touched)" class="text-danger">
                Login ID is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="password" class="col-form-label text-white">Password</label>
              <input id="password" formControlName="password" class="form-control" type="password" placeholder="Enter password" />
              <div *ngIf="registerForm.get('password')?.invalid && (registerForm.get('password')?.dirty || registerForm.get('password')?.touched)" class="text-danger">
                Password is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="confirmPassword" class="col-form-label text-white">Confirm Password</label>
              <input id="confirmPassword" formControlName="confirmPassword" class="form-control" type="password" placeholder="Confirm password" />
              <div *ngIf="registerForm.get('confirmPassword')?.invalid && (registerForm.get('confirmPassword')?.dirty || registerForm.get('confirmPassword')?.touched)" class="text-danger">
                Confirm password is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="contactNumber" class="col-form-label text-white">Contact Number</label>
              <input id="contactNumber" formControlName="contactNumber" class="form-control" type="text" placeholder="Enter contact number" />
              <div *ngIf="registerForm.get('contactNumber')?.invalid && (registerForm.get('contactNumber')?.dirty || registerForm.get('contactNumber')?.touched)" class="text-danger">
                Contact number is required
              </div>
            </div>
            <div class="form-group mb-4">
              <label for="role" class="col-form-label text-white">Role</label>
              <select id="role" formControlName="role" class="form-control">
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
            <div *ngIf="error" class="text-danger">{{ error }}</div>
            <button type="submit" class="btn button_cs button_login my-3" [disabled]="registerForm.invalid">Register</button>
            <div class="text-center mt-2 text-white">
              Already have an account? <a (click)="goToLogin()" class="btn btn-link p-0">Login here</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
</div>
